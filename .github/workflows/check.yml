name: steam-free-check

on:
  schedule:
    - cron: "17 */4 * * *"   # 每 4 小時（UTC），避開整點尖峰
  workflow_dispatch:
    inputs:
      test_notify:
        description: "只送一則測試通知"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: steam-free-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 測試
        run: python -m unittest discover -s tests -v

      - name: 測試通知
        if: ${{ inputs.test_notify }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py --test-notify

      - name: 偵測
        if: ${{ !inputs.test_notify }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - name: 存回 seen.json
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || (git commit -m "update seen.json" && git push)
